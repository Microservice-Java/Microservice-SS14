spring:
  application:
    name: choreography-saga-order
  datasource:
    url: jdbc:h2:mem:sagadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

saga:
  shipping:
    timeout-seconds: 30

logging:
  level:
    com.storex.saga: DEBUG
